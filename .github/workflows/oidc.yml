name: oidc-test
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: show context
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "REPO=${{ github.repository }}"
          echo "REF=${{ github.ref }}"
          echo "HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          echo "HAS_OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=test-audience" | jq -r .value)
            echo "TOKEN_LEN=${#TOKEN}"
            echo "PAYLOAD:"
            echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 900
          else
            echo "NO_OIDC_URL"
          fi